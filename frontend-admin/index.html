<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="广西少数民族文化遗产数字化保护与展示平台 - 壮、瑶、苗、侗等少数民族文化遗产的数字化保护、展示与传承" />
  <meta name="keywords" content="广西,少数民族,文化遗产,非遗,壮族,瑶族,苗族,侗族,数字化保护" />
  <title>广西少数民族文化遗产数字化保护与展示平台</title>
  <style>
    /* 首屏加载动画 */
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #F7FFF7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #app-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #app-loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #DFE6E9;
      border-top-color: #1A535C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #app-loading p {
      margin-top: 16px;
      color: #1A535C;
      font-size: 14px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="spinner"></div>
    <p>文化遗产平台加载中...</p>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
